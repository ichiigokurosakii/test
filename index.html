<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Index</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:100%;
    max-width:1000px;
}

header{
    text-align:center;
    margin-bottom:45px;
}

header h1{
    color:white;
    font-size:2.7rem;
    font-weight:700;
    letter-spacing:1px;
}

header p{
    color:#d1d5db;
    margin-top:10px;
    font-size:1rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
}

.card{
    text-decoration:none;
    color:white;
    padding:28px;
    border-radius:22px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    transition:.35s;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,
    rgba(255,255,255,.15),
    transparent 70%);
    opacity:0;
    transition:.35s;
}

.card:hover::before{
    opacity:1;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 18px 35px rgba(0,0,0,.35);
}

.icon{
    width:58px;
    height:58px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    margin-bottom:18px;
    background:linear-gradient(135deg,#60a5fa,#8b5cf6);
}

.card h2{
    font-size:1.2rem;
    margin-bottom:8px;
}

.card p{
    color:#dbeafe;
    font-size:.92rem;
    line-height:1.5;
}

footer{
    margin-top:45px;
    text-align:center;
    color:#cbd5e1;
    font-size:.9rem;
}

@media(max-width:600px){

header h1{
    font-size:2rem;
}

.card{
    padding:22px;
}

.icon{
    width:52px;
    height:52px;
    font-size:22px;
}
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>Rupinder</h1>
<p>Collection of useful links</p>
</header>

<div class="grid">

<a href="https://rupinderr.vercel.app/PhoneStreaming.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">🌐</div>
<h2>Phone Streaming</h2>
<p>Main website and homepage.</p>
</a>

<a href="https://rupinderr.vercel.app/obsession.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">💻</div>
<h2>Obsession</h2>
<p>One Wish Willow.</p>
</a>

<a href="https://rupinderr.vercel.app/oldindex.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">📁</div>
<h2>Drive</h2>
<p>Cloud storage and documents.</p>
</a>

<a href="https://youtube.com" class="card" hidden target="_blank" rel="noopener noreferrer">
<div class="icon">🎬</div>
<h2>YouTube</h2>
<p>Videos and tutorials.</p>
</a>

<a href="https://chat.openai.com" class="card" hidden target="_blank" rel="noopener noreferrer">
<div class="icon">🤖</div>
<h2>ChatGPT</h2>
<p>AI assistant and productivity.</p>
</a>

<a href="https://mail.google.com" class="card" hidden target="_blank" rel="noopener noreferrer">
<div class="icon">📧</div>
<h2>Gmail</h2>
<p>Email and communication.</p>
</a>

</div>

<footer>
Made with ❤️
</footer>

</div>

</body>
</html>
