<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
    const password = "RS"; // Change this to your chosen password
    let enteredPassword = sessionStorage.getItem("page_auth");

    while (enteredPassword !== password) {
        enteredPassword = prompt("Please enter the password to access this page:");
        if (enteredPassword === null) {
            // If user clicks cancel, redirect them away
            window.location.href = "https://google.com"; 
            break;
        }
        if (enteredPassword === password) {
            sessionStorage.setItem("page_auth", enteredPassword);
        } else {
            alert("Incorrect password. Try again.");
        }
    }
})();
    </script>
  </head>
<body>
  <div style="display: flex; justify-content: center; width: 100%; margin: 20px 0;">
    <video id="custom-stream" controls autoplay playsinline style="width: 100%; max-width: 800px; background: #000; border-radius: 12px;"></video>
</div>

<script src="https://jsdelivr.net"></script>
<script>
  const video = document.getElementById('custom-stream');
  // PASTE YOUR FULL EXTENSION LINK HERE
  const src = 'https://vercel.app';

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
  }
</script>

  <div style="display: flex; justify-content: center; align-items: center;">
    <a href="MaterialYou.html">Theme</a>
  </div>
</body>
</html>
