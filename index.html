<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😈</text></svg>">
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Index</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:100%;
    max-width:1000px;
}

header{
    text-align:center;
    margin-bottom:45px;
}

header h1{
    color:white;
    font-size:2.7rem;
    font-weight:700;
    letter-spacing:1px;
}

header p{
    color:#d1d5db;
    margin-top:10px;
    font-size:1rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
}

.card{
    text-decoration:none;
    color:white;
    padding:28px;
    border-radius:22px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    transition:.35s;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,
    rgba(255,255,255,.15),
    transparent 70%);
    opacity:0;
    transition:.35s;
}

.card:hover::before{
    opacity:1;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 18px 35px rgba(0,0,0,.35);
}

.icon{
    width:58px;
    height:58px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    margin-bottom:18px;
    background:linear-gradient(135deg,#60a5fa,#8b5cf6);
}

.card h2{
    font-size:1.2rem;
    margin-bottom:8px;
}

.card p{
    color:#dbeafe;
    font-size:.92rem;
    line-height:1.5;
}

footer{
    margin-top:45px;
    text-align:center;
    color:#cbd5e1;
    font-size:.9rem;
}

@media(max-width:600px){

header h1{
    font-size:2rem;
}

.card{
    padding:22px;
}

.icon{
    width:52px;
    height:52px;
    font-size:22px;
}
}
.live-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 10px;
    border-radius: 50%;
    background: #ff3b3b;
    vertical-align: middle;
    box-shadow: 0 0 0 0 rgba(255,59,59,.7);
    animation: pulse 1.6s infinite;
}
@keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.65); }
      70% { box-shadow: 0 0 0 12px rgba(255, 59, 59, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0); }
    }
.badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
    }

</style>
</head>

<body>

<div class="container">

<header>
<h1>Rupinder</h1>
<p>Collection of useful links</p>
</header>

<div class="grid">

<a href="https://rupinderr.vercel.app/PhoneStreaming.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">🌐</div>
<h2>Phone Streaming</h2>
<p>Main website and homepage.</p>
</a>

<a href="https://rupinderr.vercel.app/obsession.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">💻</div>
<h2>Obsession</h2>
<p>One Wish Willow.</p>
</a>

<a href="https://rupinderr.vercel.app/oldindex.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">📁</div>
<h2>Old Index</h2>
<p>Cloud storage and documents.</p>
</a>

<a href="https://rupinderr.vercel.app/Live.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">⚽</div>
<h2><span class="live-dot"></span>Live Football</h2>
<p>Live Matches and Streams</p>
</a>

<a href="Baki.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">👹</div>
<h2>Baki</h2>
<p>Baki Hanma Invincible Samurai.</p>
</a>

<a href="Troy.html" class="card" target="_blank" rel="noopener noreferrer">
<div class="icon">📧</div>
<h2>Troy</h2>
<p>Movie Streaming</p>
</a>

</div>

<footer>
Made with ❤️
</footer>

</div>

</body>
</html>
