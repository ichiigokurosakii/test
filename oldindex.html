    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
    const password = "RS"; // Change this to your chosen password
    let enteredPassword = sessionStorage.getItem("page_auth");

    while (enteredPassword !== password) {
        enteredPassword = prompt("Please enter the password to access this page:");
        if (enteredPassword === null) {
            // If user clicks cancel, redirect them away
            window.location.href = "https://google.com"; 
            break;
        }
        if (enteredPassword === password) {
            sessionStorage.setItem("page_auth", enteredPassword);
        } else {
            alert("Incorrect password. Try again.");
        }
    }
})();
    </script>
